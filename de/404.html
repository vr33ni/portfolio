<!DOCTYPE html> 
<html lang="en">  <head>
  <!-- 1️⃣ Apply saved theme BEFORE anything renders -->
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.classList.add(theme);
    })();
  </script>

  <!-- 2️⃣ Meta and Page Title -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>

  <!-- 3️⃣ Load Tailwind with dark mode support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
</head>

<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 font-sans">

</div>

<!-- Dark Mode Toggle Button -->

<!-- Scripts -->
<script>
  // Hamburger Toggle
  const hamburgerIcon = document.getElementById("hamburger-icon");
  const mobileMenu = document.getElementById("mobile-menu");
  hamburgerIcon.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });

  // Dark Mode Toggle
  window.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("toggleDark");
    if (toggle) {
      toggle.addEventListener("click", function () {
        const html = document.documentElement;
        const isDark = html.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });
    }

    // Set theme on load
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  });
</script>
