<section class="py-10 max-w-xl mx-auto px-6">
  <!-- Success Message -->
  <div id="success-msg" class="bg-green-100 text-green-800 border border-green-300 px-4 py-3 rounded mb-6 text-center" style="display: none;">
    ✅ Thanks! Your message has been sent. I’ll get back to you soon.
  </div>

  <!-- Contact Form -->
  <form id="contact-form" action="https://formspree.io/f/meoalvkw" method="POST" class="space-y-6">
    <!-- Honeypot Field -->
    <input type="text" name="_gotcha" style="display:none">

    <!-- Name Field -->
    <div>
      <label for="name" class="block text-sm text-gray-600 dark:text-gray-300">Name</label>
      <input type="text" id="name" name="name" required class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600">
    </div>

    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm text-gray-600 dark:text-gray-300">Email</label>
      <input type="email" id="email" name="email" required class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600">
    </div>

    <!-- Message Field -->
    <div>
      <label for="message" class="block text-sm text-gray-600 dark:text-gray-300">Message</label>
      <textarea id="message" name="message" rows="5" required class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600"></textarea>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Send Message</button>
  </form>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('contact-form');
    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', function (event) {
      event.preventDefault(); // Prevent default form submission for more flexible handling of the form (clear form after submission)

      const formData = new FormData(form);

      fetch(form.action, {
        method: form.method,
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          successMsg.style.display = 'block'; // Show success message
          form.reset(); // Reset form fields
        } else {
          return response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              alert(data["errors"].map(error => error["message"]).join(", "));
            } else {
              alert('Oops! There was a problem submitting your form');
            }
          });
        }
      }).catch(error => {
        alert('Oops! There was a problem submitting your form');
      });
    });
  });
</script>
