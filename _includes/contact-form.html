<!-- _includes/contact-form.html -->
<section class="py-16 max-w-2xl mx-auto px-6">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-800 dark:text-white">Let's Connect</h1>
  
    {% if page.form_success %}
      <div class="mb-6 bg-green-100 text-green-800 px-4 py-3 rounded-md border border-green-300 text-center">
        Thanks for your message! I'll get back to you soon.
      </div>
    {% endif %}
  
    <form action="https://formspree.io/f/meoalvkw" method="POST" class="space-y-6">
      <!-- Honeypot spam trap -->
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />
  
      <!-- Redirect URL for Formspree -->
      <input type="hidden" name="_redirect" value="{{ site.url }}{{ site.baseurl }}/contact.html?success=true" />
  
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Name</label>
        <input type="text" name="name" id="name" required
               class="mt-1 block w-full px-4 py-2 rounded-md bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 focus:ring-blue-500 focus:border-blue-500" />
      </div>
  
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
        <input type="email" name="email" id="email" required
               class="mt-1 block w-full px-4 py-2 rounded-md bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 focus:ring-blue-500 focus:border-blue-500" />
      </div>
  
      <div>
        <label for="message" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Message</label>
        <textarea name="message" id="message" rows="5" required
                  class="mt-1 block w-full px-4 py-2 rounded-md bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 focus:ring-blue-500 focus:border-blue-500"></textarea>
      </div>
  
      <button type="submit"
              class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition">
        Send Message
      </button>
    </form>
  </section>
