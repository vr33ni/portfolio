<section class="py-10 max-w-xl mx-auto px-6">

  

  <form id="contact-form" action="https://formspree.io/f/meoalvkw" method="POST" class="space-y-6">
    <input type="hidden" name="_redirect" value="{{ site.url }}{{ site.baseurl }}/contact/?success=true" />
    <input type="hidden" name="_gotcha" style="display:none">

    <div>
      <label for="name" class="block text-sm text-gray-600 dark:text-gray-300">Name</label>
      <input type="text" name="name" required
             class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600" />
    </div>

    <div>
      <label for="email" class="block text-sm text-gray-600 dark:text-gray-300">Email</label>
      <input type="email" name="email" required
             class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600" />
    </div>

    <div>
      <label for="message" class="block text-sm text-gray-600 dark:text-gray-300">Message</label>
      <textarea name="message" rows="5" required
                class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600"></textarea>
    </div>

    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
      Send Message
    </button>
  </form>

  <div id="success-msg" style="display: none;" class="bg-green-100 text-green-800 border border-green-300 px-4 py-3 rounded mb-6 text-center flex justify-between items-center">
    <span>✅ Thanks! Your message has been sent. I’ll get back to you soon.</span>
    <button id="close-msg" class="ml-4 text-green-800 hover:text-green-600 text-xl leading-none">&times;</button>
  </div>
  
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const showSuccess = params.get("success") === "true";
  
      const msgBox = document.getElementById("success-msg");
      const closeBtn = document.getElementById("close-msg");
      const form = document.getElementById("contact-form");
  
      if (showSuccess && msgBox) {
        msgBox.style.display = "flex";
      }
  
      if (closeBtn && msgBox && form) {
        closeBtn.addEventListener("click", () => {
          msgBox.style.display = "none";
          form.reset();
  
          // Clear non-hidden fields manually (just in case)
          form.querySelectorAll("input:not([type='hidden']), textarea").forEach(f => f.value = "");
  
          // Remove query param from URL
          if (window.history.replaceState) {
            const cleanUrl = window.location.href.split("?")[0];
            window.history.replaceState(null, "", cleanUrl);
          }
        });
      }
    });
  </script>
  
</section>
