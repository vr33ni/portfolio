image: ruby:3.3

stages:
  - build
  - deploy

variables:
  JEKYLL_ENV: production

build:
  stage: build
  script:
    - |
      set -e
      gem install bundler jekyll
      bundle install --jobs 4 --retry 3

      # Split CI_PAGES_URL into site.url and baseurl
      SITE_URL="$(echo "$CI_PAGES_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
      BASE_PATH="$(echo "$CI_PAGES_URL" | sed -E 's#https?://[^/]+##')"
      if [ "$BASE_PATH" = "/" ]; then BASE_PATH=""; fi

      # Override config for CI build
      printf 'url: "%s"\nbaseurl: "%s"\n' "$SITE_URL" "$BASE_PATH" > _config_ci.yml

      bundle exec jekyll build --config _config.yml,_config_ci.yml -d public
  artifacts:
    paths:
      - public
  only:
    - master

pages:
  stage: deploy
  script:
    - echo "Publishing to Pages…"
  dependencies:
    - build
  artifacts:
    paths:
      - public
  only:
    - master
