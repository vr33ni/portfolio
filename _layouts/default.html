<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
  <!-- 1️⃣ Apply saved theme BEFORE anything renders -->
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.classList.add(theme);
    })();
  </script>

  <!-- 2️⃣ Meta and Page Title -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>

  <!-- 3️⃣ Load Tailwind with dark mode support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
</head>

<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 font-sans">

  <!-- ✅ Include navigation -->
  {% include nav.html %}

  <!-- ✅ Page Content -->
  <main class="max-w-4xl mx-auto p-6">
    {{ content }}
  </main>

  <!-- ✅ Include footer -->
  {% include footer.html %}

</body>
</html>
