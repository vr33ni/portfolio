name: Jekyll site CI

on:
  push:
    branches:
      - master # Replace with your preferred branch (e.g., 'main' or 'master')

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up Ruby (ensure you are using the correct Ruby version)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # Adjust this to match the Ruby version in your project (or use .ruby-version file)
          bundler-cache: true # Cache the Ruby gems (including Jekyll) for faster builds

      # Step 3: Set up Node and build Tailwind CSS
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      # Step 4: Install dependencies (Bundler and Jekyll)
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      # Step 5: Build the Jekyll site
      - name: Build site
        run: |
          bundle exec jekyll build

      # Step 5: Deploy to GitHub Pages (the gh-pages branch)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./_site # This is the directory where Jekyll builds your site
