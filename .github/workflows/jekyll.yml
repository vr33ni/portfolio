name: Jekyll site CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout repository
      uses: actions/checkout@v2

    # Step 2: Set up Ruby (ensure you are using the correct Ruby version)
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.7.8'  # Use Ruby version 2.7.8 or adjust this version

    # Step 3: Install dependencies (bundler and Jekyll)
    - name: Install dependencies
      run: |
        gem install bundler:latest
        bundle install

    # Step 4: Build the Jekyll site
    - name: Build site
      run: |
        bundle exec jekyll build

    # Step 5: Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
